<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>本日のご法要 管理システム</title><style>
:root{--ink:#20252a;--muted:#6d716d;--paper:#f7f4ed;--line:#d9d2c4;--green:#3f6256;--gold:#a58a55;--rose:#806260;--navy:#525b70}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Yu Mincho','Hiragino Mincho ProN','Yu Gothic',sans-serif;color:var(--ink);background:#ebe8e1}button,input,select{font:inherit}.app{min-height:100vh}.top{height:64px;background:#20272a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top b{font-size:21px}.tabs button{border:0;padding:10px 16px;border-radius:8px;margin-left:8px;cursor:pointer}.tabs .active{background:#fff;color:#222}.wrap{max-width:1450px;margin:auto;padding:22px}.panel{background:#fff;border-radius:14px;box-shadow:0 3px 18px #0001;padding:20px;margin-bottom:18px}.row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:#666;font-weight:700}.field input,.field select{border:1px solid #cfcfcf;border-radius:8px;padding:10px 12px;background:white;min-height:43px}.field.name input{width:170px}.suffix{display:flex;align-items:center;gap:8px}.suffix span{font-size:19px;font-weight:700}.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}.primary{background:#405e53;color:white}.ghost{background:#eee}.danger{background:#f4e3e3;color:#8a3333}.datebox{display:flex;align-items:center;justify-content:space-between;gap:20px}.datebox input{font-size:17px;padding:9px}.hint{color:#777;font-size:13px}.hall{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:15px}.hallhead{padding:11px 15px;color:#fff;font-weight:800;display:flex;justify-content:space-between}.h1{background:var(--navy)}.h2{background:var(--green)}.h3{background:var(--rose)}.h4{background:var(--gold)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#fafafa;font-size:13px}.actions button{margin-right:5px;padding:6px 9px;border:0;border-radius:6px;cursor:pointer}.empty{text-align:center;color:#999;padding:15px}.monitor{display:none;background:var(--paper);min-height:calc(100vh - 64px);position:relative;overflow:hidden}.monitor:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 8% 90%,#b8c8b733 0 8%,transparent 9%),linear-gradient(120deg,transparent 65%,#c6aa7030 66%,transparent 68%);pointer-events:none}.screen{position:relative;max-width:1600px;margin:auto;padding:35px 55px}.screenTitle{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #c7b78f;padding-bottom:14px;margin-bottom:24px}.screenTitle h1{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-size:56px;margin:0;font-weight:600}.screenDate{font-family:'Yu Mincho',serif;font-size:30px}.screenSub{font-size:15px;margin-top:8px;color:#555}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:#ffffffd9;border:1px solid #d9d3c8;border-radius:7px;overflow:hidden;box-shadow:0 2px 9px #00000012}.card h2{color:#fff;margin:0;padding:13px 22px;font-family:'Yu Mincho',serif;font-size:31px}.card table th,.card table td{text-align:center;font-family:'Yu Mincho',serif;font-size:24px;padding:12px}.card table th{font-size:18px;font-weight:500}.foot{text-align:right;margin-top:25px;font-family:'Yu Mincho',serif;color:#555}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.screen{padding:20px}.screenTitle h1{font-size:36px}.screenDate{font-size:20px}.card table td{font-size:18px}.wrap{padding:10px}}
</style></head><body><div class='app'><div class='top'><b>本日のご法要｜管理システム</b><div class='tabs'><button id='adminTab' class='active'>管理画面</button><button id='previewTab'>モニター表示</button></div></div>
<main id='admin' class='wrap'><section class='panel'><div class='datebox'><div><h2 style='margin:0 0 6px'>表示日の設定</h2><div class='hint'>毎日の予定を日付ごとに保存できます。</div></div><input type='date' id='date'></div></section>
<section class='panel'><h2 style='margin-top:0'>予定を登録</h2><div class='row'><div class='field'><label>会場</label><select id='hall'><option>第一会場</option><option>第二会場</option><option>第三会場</option><option>とこしえ</option></select></div><div class='field'><label>用途</label><select id='purpose'><option>建墓</option><option>埋葬</option><option>建墓・埋葬</option><option>年回</option><option>納骨</option></select></div><div class='field'><label>時間</label><input type='time' id='time' step='900'></div><div class='field name'><label>喪家名（「家」は自動表示）</label><div class='suffix'><input id='family' placeholder='例：山田'><span>家</span></div></div><button type='button' class='btn primary' id='add'>＋ 予定を追加</button><div id='msg' style='width:100%;font-weight:700;color:#315d4e;margin-top:4px'></div></div></section>
<section class='panel'><div class='row' style='justify-content:space-between'><div><h2 style='margin:0'>当日の予定</h2><div class='hint'>変更内容はこの端末に自動保存されます。</div></div><div><button class='btn ghost' id='copyPrev'>前日をコピー</button> <button class='btn danger' id='clear'>全件クリア</button></div></div><div id='lists'></div></section></main>
<main id='monitor' class='monitor'><div class='screen'><div class='screenTitle'><h1>本日のご法要</h1><div><div id='screenDate' class='screenDate'></div><div class='screenSub'>故人を偲び　心を込めてお手伝いいたします</div></div></div><div class='grid' id='cards'></div><div class='foot'>大切な方のご縁を、これからもずっと。</div></div></main></div>
<script>
const halls=['第一会場','第二会場','第三会場','とこしえ'];const cls=['h1','h2','h3','h4'];const $=s=>document.querySelector(s);const date=$('#date');let editing=null;
function today(){const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`} date.value=today();
const memoryStore={}; function key(d=date.value){return 'houyou-'+d} function load(d=date.value){try{const v=localStorage.getItem(key(d)); if(v!==null)return JSON.parse(v)||[]}catch(e){} return memoryStore[key(d)]||[]} function save(a,d=date.value){memoryStore[key(d)]=a; try{localStorage.setItem(key(d),JSON.stringify(a))}catch(e){} render()}
function jpTime(t){let [h,m]=t.split(':').map(Number);return (h<12?'午前 ':'午後 ')+((h%12)||12)+':'+String(m).padStart(2,'0')}
function render(){let a=load();let out='';halls.forEach((h,i)=>{let rows=a.map((x,n)=>({...x,n})).filter(x=>x.hall===h).sort((x,y)=>x.time.localeCompare(y.time));out+=`<div class='hall'><div class='hallhead ${cls[i]}'><span>${h}</span><span>${rows.length}件</span></div><table><thead><tr><th>用途</th><th>時間</th><th>家名</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${x.purpose}</td><td>${jpTime(x.time)}</td><td>${x.family}家</td><td class='actions'><button onclick='edit(${x.n})'>編集</button><button onclick='del(${x.n})'>削除</button></td></tr>`).join(''):`<tr><td colspan='4' class='empty'>予定はありません</td></tr>`}</tbody></table></div>`});$('#lists').innerHTML=out;renderMonitor()}
function renderMonitor(){let a=load();let d=new Date(date.value+'T00:00:00');let w='日月火水木金土'[d.getDay()];$('#screenDate').textContent=`${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日（${w}）`;$('#cards').innerHTML=halls.map((h,i)=>{let rows=a.filter(x=>x.hall===h).sort((x,y)=>x.time.localeCompare(y.time));return `<div class='card'><h2 class='${cls[i]}'>${h}</h2><table><thead><tr><th>内容</th><th>時間</th><th>家名</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${x.purpose}</td><td>${jpTime(x.time)}</td><td>${x.family}家</td></tr>`).join(''):`<tr><td colspan='3' style='color:#aaa'>—</td></tr>`}</tbody></table></div>`}).join('')}
$('#add').onclick=()=>{let family=$('#family').value.trim().replace(/家$/,'');if(!family||!$('#time').value){$('#msg').textContent='時間と喪家名を入力してください。';return;} $('#msg').textContent='';let a=load(),x={hall:$('#hall').value,purpose:$('#purpose').value,time:$('#time').value,family};if(editing===null)a.push(x);else{a[editing]=x;editing=null;$('#add').textContent='＋ 予定を追加'}save(a);$('#family').value='';$('#time').value='';$('#msg').textContent='予定を登録しました。'};
window.edit=n=>{let x=load()[n];$('#hall').value=x.hall;$('#purpose').value=x.purpose;$('#time').value=x.time;$('#family').value=x.family;editing=n;$('#add').textContent='変更を保存';scrollTo({top:0,behavior:'smooth'})};window.del=n=>{if(confirm('この予定を削除しますか？')){let a=load();a.splice(n,1);save(a)}};
$('#clear').onclick=()=>{if(confirm('この日の予定をすべて削除しますか？'))save([])};$('#copyPrev').onclick=()=>{let d=new Date(date.value+'T00:00:00');d.setDate(d.getDate()-1);let prev=d.toISOString().slice(0,10),a=load(prev);if(!a.length)return alert('前日の予定がありません。');if(confirm('前日の予定をこの日にコピーしますか？'))save(a)};date.onchange=render;
$('#previewTab').onclick=()=>{$('#admin').classList.add('hidden');$('#monitor').style.display='block';$('#adminTab').classList.remove('active');$('#previewTab').classList.add('active');renderMonitor()};$('#adminTab').onclick=()=>{$('#admin').classList.remove('hidden');$('#monitor').style.display='none';$('#adminTab').classList.add('active');$('#previewTab').classList.remove('active')};render();
</script></body></html>
